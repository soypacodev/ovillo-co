name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Solo lectura del código: ningún trabajo publica nada ni escribe en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22.18 o superior: los scripts de la base de datos cargan src/datos/semilla.ts sin compilar.
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

# Las acciones van fijadas por commit (con su versión al lado) para que una
# etiqueta movida no cambie lo que se ejecuta. Dependabot las mantiene al día.
jobs:
  # ===================================================================
  #  Tipos, estilo y pruebas unitarias
  # ===================================================================
  calidad:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Vitest
        run: npx vitest run

  # ===================================================================
  #  Base de datos: migraciones, semilla, RLS y concurrencia
  # ===================================================================
  # scripts/probar-bd.sh levanta un PostgreSQL temporal propio (sin Docker
  # ni cuenta de Supabase), así que solo necesita los binarios.
  base-de-datos:
    name: Base de datos (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Probar la base de datos
        run: npm run db:probar
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  # ===================================================================
  #  Compilación de producción
  # ===================================================================
  # Sin variables de Supabase ni de Stripe: es el modo demostración, el
  # mismo que prueban los e2e.
  build:
    name: Compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: next build
        run: npx next build

      - name: Guardar la compilación
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compilacion
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ===================================================================
  #  Extremo a extremo contra la compilación de producción
  # ===================================================================
  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Recuperar la compilación
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compilacion
          path: .next

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Arrancar la tienda
        run: |
          npx next start -p 3210 > next.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$E2E_URL/"; then exit 0; fi
            sleep 1
          done
          echo "La tienda no arrancó en 60 s" >&2
          cat next.log >&2
          exit 1

      - name: Playwright
        run: npx playwright test

      - name: Guardar trazas de los fallos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fallos
          path: |
            test-results
            next.log
          retention-days: 7
          if-no-files-found: ignore
