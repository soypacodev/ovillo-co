version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    # Las versiones mayores se actualizan a mano: suelen traer cambios que rompen.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # Las menores y los parches llegan juntos en una sola PR.
    groups:
      dependencias:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      acciones:
        patterns: ['*']
